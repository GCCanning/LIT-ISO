<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LIT-ISO — Biome Variant Cards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial,sans-serif;background:#15171c;color:#ddd;min-height:100vh}
header{background:#1d2027;border-bottom:1px solid #2a2f3a;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:15px;font-weight:700;color:#e8c468}
header .sub{font-size:11px;color:#889}
#toolbar{background:#191c22;border-bottom:1px solid #2a2f3a;padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#toolbar button{background:#2a2f3a;color:#ddd;border:1px solid #444;border-radius:4px;padding:5px 12px;cursor:pointer;font-size:12px;transition:background .15s}
#toolbar button:hover{border-color:#888}
#toolbar button.active{background:#3a3018;border-color:#e8c468;color:#e8c468}
#search{background:#22262e;border:1px solid #3a4150;border-radius:4px;padding:5px 10px;color:#ddd;font-size:12px;width:200px}
#search:focus{outline:none;border-color:#e8c468}
#count{font-size:11px;color:#556;margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding:14px}
.biome-group{grid-column:1/-1;margin-top:4px}
.biome-group h2{font-size:12px;font-weight:700;color:#889;text-transform:uppercase;letter-spacing:0.08em;padding:0 2px 8px;border-bottom:1px solid #2a2f3a;margin-bottom:12px}

.card{background:#1d2027;border:2px solid #2a2f3a;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:#3d4456}
.card.hidden{display:none}
.card-head{padding:9px 12px;background:#22262e;display:flex;align-items:flex-start;gap:8px}
.card-head .vtag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;border-radius:3px;padding:2px 6px;flex-shrink:0;margin-top:2px}
.card-head .info{flex:1;min-width:0}
.card-head .vname{font-size:13px;font-weight:700;color:#e8c468;line-height:1.2}
.card-head .vdesc{font-size:11px;color:#889;line-height:1.45;margin-top:3px}

.assets-row{padding:10px 12px;border-top:1px solid #23262d;display:flex;gap:14px}
.asset-group{flex:1;min-width:0}
.asset-group h4{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#556;margin-bottom:6px}
.swatches{display:flex;flex-wrap:wrap;gap:3px}
.swatch{width:36px;height:36px;border-radius:3px;overflow:hidden;background:#12141a;border:1px solid #2a2f3a;display:flex;align-items:center;justify-content:center;cursor:default;position:relative}
.swatch img{width:100%;height:100%;image-rendering:pixelated;object-fit:cover}
.swatch:hover .tip{display:block}
.tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#12141a;border:1px solid #3a4150;border-radius:4px;padding:3px 6px;font-size:9px;color:#ccc;white-space:nowrap;z-index:100;pointer-events:none}
.prop-swatch{width:52px;height:52px}
.prop-swatch img{object-fit:contain;padding:2px}

.mob-row{padding:9px 12px;border-top:1px solid #23262d;display:flex;align-items:flex-start;gap:10px}
.mob-icon{width:32px;height:32px;border-radius:4px;background:#2a2f3a;border:1px solid #3a4150;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.mob-info{flex:1;min-width:0}
.mob-name{font-size:12px;font-weight:700;color:#c8a850}
.mob-desc{font-size:10px;color:#778;line-height:1.45;margin-top:2px}
.drops{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.drop-chip{font-size:9px;color:#667;background:#22262e;border-radius:3px;padding:1px 5px;font-family:monospace}

/* biome tints */
.vtag.meadow{background:#1e3a1e;color:#6cba6c}
.vtag.forest{background:#1a3020;color:#4ab874}
.vtag.mountain{background:#2a2d30;color:#8aafcc}
.vtag.snow{background:#222d3a;color:#aaccee}
.vtag.beach{background:#2a2a18;color:#c8b060}
.vtag.dungeon{background:#1e1a2e;color:#9a80cc}
</style>
</head>

  <h1>🗺 Biome Variant Cards</h1>

  <button class="active" data-filter="all">All</button>
  <button data-filter="meadow">🌿 Meadow</button>
  <button data-filter="forest">🌲 Forest</button>
  <button data-filter="mountain">⛰ Mountain</button>
  <button data-filter="snow">❄ Snow</button>
  <button data-filter="beach">🏖 Beach</button>

<script src="assets.js"></script>

const BIOME_LABELS = {
  meadow:'🌿 Meadow', forest:'🌲 Forest', mountain:'⛰ Mountain',

// ── PROP path resolver ─────────────────────────────────────────────────────
const PROP_SUBDIRS = {
  forest_oak_tree:'prop', forest_deep_oak_tree:'prop', forest_moss_bush:'prop',
  forest_pine:'prop/review_sync/ready_no_overwrite/forest',
  forest_pine_young:'prop/review_sync/ready_no_overwrite/forest',
  forest_dead_tree:'prop/review_sync/ready_no_overwrite/forest',
  forest_fern:'prop/review_sync/ready_no_overwrite/forest',
  forest_mushrooms:'prop/review_sync/ready_no_overwrite/forest',

function propPath(id){
  if(AMAP[id]) return AMAP[id];
  const sub = PROP_SUBDIRS[id];
  if(sub) return `assets/${sub}/${id}.png`;
  return `assets/prop/${id}.png`;
}
function tilePath(id){
  if(AMAP[id]) return AMAP[id];
  return `assets/tile/${id}.png`;
}

// ── BUILD UI ───────────────────────────────────────────────────────────────
const grid = document.getElementById('grid');
let currentFilter = 'all';
let searchTerm = '';

function buildGrid(){
  grid.innerHTML = '';
  const biomes = ['meadow','forest','mountain','snow','beach','dungeon'];
  let visCount = 0;

  biomes.forEach(biome => {
    const group = VARIANTS.filter(v => v.biome === biome);
    const visible = group.filter(v => matchesFilter(v));
    if(visible.length === 0) return;

    const section = document.createElement('div');
    section.className = 'biome-group';
    section.innerHTML = `<h2>${BIOME_LABELS[biome]} — ${visible.length} variant${visible.length>1?'s':''}</h2>`;
    grid.appendChild(section);

    const row = document.createElement('div');
    row.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;grid-column:1/-1';
    grid.appendChild(row);

    visible.forEach(v => {
      visCount++;
      row.appendChild(buildCard(v));
    });
  });

  document.getElementById('count').textContent = `${visCount} of ${VARIANTS.length} variants`;
}

function matchesFilter(v){
  if(currentFilter !== 'all' && v.biome !== currentFilter) return false;
  if(searchTerm && !v.name.toLowerCase().includes(searchTerm)) return false;
  return true;
}

function buildCard(v){
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.biome = v.biome;

  // head
  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `
    <span class="vtag ${v.biome}">${BIOME_LABELS[v.biome].split(' ')[1]}</span>
    <div class="info">
      <div class="vname">${v.name}</div>
      <div class="vdesc">${v.desc}</div>
    </div>`;
  card.appendChild(head);

  // assets
  const assets = document.createElement('div');
  assets.className = 'assets-row';

  const tileGroup = document.createElement('div');
  tileGroup.className = 'asset-group';
  tileGroup.innerHTML = '<h4>Tiles</h4>';
  const tileSwatches = document.createElement('div');
  tileSwatches.className = 'swatches';
  v.tiles.forEach(tid => {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.innerHTML = `<img src="${tilePath(tid)}" loading="lazy" onerror="this.style.opacity=0.2"><span class="tip">${tid}</span>`;
    tileSwatches.appendChild(sw);
  });
  tileGroup.appendChild(tileSwatches);
  assets.appendChild(tileGroup);

  const propGroup = document.createElement('div');
  propGroup.className = 'asset-group';
  propGroup.innerHTML = '<h4>Props</h4>';
  const propSwatches = document.createElement('div');
  propSwatches.className = 'swatches';
  v.props.forEach(pid => {
    const sw = document.createElement('div');
    sw.className = 'swatch prop-swatch';
    sw.innerHTML = `<img src="${propPath(pid)}" loading="lazy" onerror="this.style.opacity=0.2"><span class="tip">${pid}</span>`;
    propSwatches.appendChild(sw);
  });
  propGroup.appendChild(propSwatches);
  assets.appendChild(propGroup);
  card.appendChild(assets);

  // mob
  const mob = document.createElement('div');
  mob.className = 'mob-row';
  const drops = v.mob.drops.map(d=>`<span class="drop-chip">${d}</span>`).join('');
  mob.innerHTML = `
    <div class="mob-icon">${v.mob.icon}</div>
    <div class="mob-info">
      <div class="mob-name">${v.mob.name}</div>
      <div class="mob-desc">${v.mob.desc}</div>
      <div class="drops">${drops}</div>
    </div>`;
  card.appendChild(mob);

  return card;
}

// ── EVENTS ─────────────────────────────────────────────────────────────────
document.querySelectorAll('#toolbar button[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#toolbar button[data-filter]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    buildGrid();
  });
});
document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  buildGrid();
});

buildGrid();
</script>
<script src="nav.js"></script>
